<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CutMetric Legal</title>
  <meta name="description" content="CutMetric privacy policy and terms of service">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #070911;
      --panel: #111521;
      --text: #f6f7fb;
      --muted: #a9adbd;
      --line: rgba(255,255,255,.14);
      --accent: #ff7a18;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top left, rgba(255,122,24,.18), transparent 32rem), var(--bg);
      color: var(--text);
      line-height: 1.55;
    }
    main {
      width: min(860px, 100%);
      margin: 0 auto;
      padding: 48px 20px 72px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 8vw, 4rem);
      letter-spacing: 0;
    }
    p {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 1.08rem;
    }
    .grid {
      display: grid;
      gap: 18px;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    }
    section {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: color-mix(in srgb, var(--panel) 92%, transparent);
      padding: 22px;
    }
    h2 {
      margin: 0 0 16px;
      font-size: 1.25rem;
    }
    a {
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 52px;
      margin-top: 12px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--text);
      text-decoration: none;
      background: rgba(255,255,255,.04);
    }
    a:focus-visible,
    a:hover {
      border-color: var(--accent);
      outline: none;
    }
    a span:last-child {
      color: var(--accent);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <h1>CutMetric Legal</h1>
    <p>Privacy and terms documents for CutMetric.</p>
    <div class="grid">
      <section aria-labelledby="de-heading">
        <h2 id="de-heading">Deutsch</h2>
        <a href="./privacy.html"><span>Datenschutzerklärung</span><span>›</span></a>
        <a href="./terms.html"><span>Nutzungsbedingungen</span><span>›</span></a>
      </section>
      <section aria-labelledby="en-heading">
        <h2 id="en-heading">English</h2>
        <a href="./privacy-en.html"><span>Privacy Policy</span><span>›</span></a>
        <a href="./terms-en.html"><span>Terms of Service</span><span>›</span></a>
      </section>
    </div>
  </main>
</body>
</html>
